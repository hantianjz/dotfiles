onboarding = false
# Keep Herdr's multiplexer controls aligned with tmux/tmux.keys.conf.
#
# Ctrl-a Ctrl-a sends a literal Ctrl-a to the active program.

[keys]
prefix = "ctrl+a"

# tmux: R reloads config; r only refreshes its client and has no Herdr analogue.
reload_config = "prefix+shift+r"
resize_mode = ""

# tmux opens its command prompt on s, so move Herdr settings out of the way of
# the matching split binding below.
settings = ""

# tmux q displays/selects panes, S chooses a session, and d detaches.
workspace_picker = "prefix+q"
goto = "prefix+shift+s"
detach = "prefix+d"

# tmux windows correspond to Herdr tabs.
new_tab = "prefix+shift+c"
previous_tab = ["prefix+p", "prefix+ctrl+p"]
next_tab = ["prefix+n", "prefix+ctrl+n"]

# tmux clients correspond most closely to Herdr workspaces.
previous_workspace = "prefix+="
next_workspace = "prefix+minus"

# Pane creation and prefixed movement mirror both tmux variants. Direct
# Ctrl-h/j/k/l goes through vim-herdr-navigation so Neovim gets first chance
# to move between its own windows before crossing a Herdr pane boundary.
split_vertical = ["prefix+v", "prefix+ctrl+v"]
split_horizontal = ["prefix+s", "prefix+ctrl+s"]
focus_pane_left = ["prefix+h", "prefix+ctrl+h"]
focus_pane_down = ["prefix+j", "prefix+ctrl+j"]
focus_pane_up = ["prefix+k", "prefix+ctrl+k"]
focus_pane_right = ["prefix+l", "prefix+ctrl+l"]

zoom = "prefix+shift+z"
copy_mode = "prefix+["
toggle_sidebar = "prefix+b"

switch_workspace = "ctrl+1..9"
focus_agent = "prefix+1..9"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left through Neovim or Herdr panes"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down through Neovim or Herdr panes"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up through Neovim or Herdr panes"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right through Neovim or Herdr panes"

[ui.toast]
delivery = "terminal"

[ui]
show_agent_labels_on_pane_borders = true
prompt_new_tab_name = false
agent_panel_sort = "spaces"
