config-version = 2
# Workspaces 6–9 still have shortcuts, but exist only on demand.
persistent-workspaces = ['1', '2', '3', '4', '5']

# Optional experiments: uncomment one at a time, then reload AeroSpace.
# Focus windows on hover, rather than only by click or keyboard.
focus-follows-mouse.enabled = true
# Reload on save; reload manually once to activate the watcher.
auto-reload-config = true
# Pin workspace 3 to the secondary display when there are two displays,
# otherwise to the main display. Cmd+Ctrl+Tab cannot move a pinned workspace.
# workspace-to-monitor-force-assignment.'3' = ['secondary', 'main']

# Launch apps when AeroSpace starts, including at macOS login.
after-startup-command = [
  'exec-and-forget /usr/bin/open -g -a Slack',
  'exec-and-forget /usr/bin/open -g -a "Google Chrome"',
  'exec-and-forget /usr/bin/open -g -a Buzz',
  'exec-and-forget /usr/bin/open -g -a Rex',
]

# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 50

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodness#disable-hide-app
automatically-unhide-macos-hidden-apps = true

# Route new windows without following them to the destination workspace.
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.tinyspeck.slackmacgap || test %{app-bundle-id} = xyz.block.buzz.desktop'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.superlogical.rex'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if = 'test %{app-bundle-id} = io.readwise.read || test %{app-bundle-id} = com.apple.Safari || test %{app-bundle-id} = com.apple.Music'
run = 'move-node-to-workspace 5'

[[on-window-detected]]
# Only the legacy matcher can distinguish windows already open at startup.
if = { app-id = 'com.google.Chrome', during-aerospace-startup = true }
run = 'exec-and-forget ~/.config/aerospace/chrome-first-window remember'

[[on-window-detected]]
if = 'test %{app-bundle-id} = com.google.Chrome'
run = 'exec-and-forget ~/.config/aerospace/chrome-first-window'

# Possible values: (qwerty|dvorak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See: https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
inner.horizontal = 0
inner.vertical = 0
outer.left = 0
outer.bottom = 0
outer.top = 0
outer.right = 0

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}
[mode.main.binding]

# All possible keys:
# - Letters.        a, b, c, ..., z
# - Numbers.        0, 1, 2, ..., 9
# - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
# - F-keys.         f1, f2, ..., f20
# - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon, backtick,
#                   leftSquareBracket, rightSquareBracket, space, enter, esc, backspace, tab
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
# - Arrows.         left, down, up, right

# All possible modifiers: cmd, alt, ctrl, shift

# All possible commands: https://nikitabobko.github.io/AeroSpace/commands

# See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
# You can uncomment the following lines to open up terminal with alt + enter shortcut (like in i3)
# cmd-enter = '''exec-and-forget open /Applications/Ghostty.app'''

# Disable certain default MacOS keys
cmd-alt-h = []
cmd-m = []

# See: https://nikitabobko.github.io/AeroSpace/commands#layout
cmd-slash = 'layout tiles horizontal vertical'
cmd-period = 'layout accordion horizontal vertical'
# Experiment: change the whole workspace layout, not just the focused container.
# Comment out the matching binding above before enabling either line.
# cmd-slash = 'layout --root tiles horizontal vertical'
# cmd-period = 'layout --root accordion horizontal vertical'

# See: https://nikitabobko.github.io/AeroSpace/commands#move
cmd-ctrl-h = 'exec-and-forget ~/.config/aerospace/aerospace-move left'
cmd-ctrl-j = 'exec-and-forget ~/.config/aerospace/aerospace-move down'
cmd-ctrl-k = 'exec-and-forget ~/.config/aerospace/aerospace-move up'
cmd-ctrl-l = 'exec-and-forget ~/.config/aerospace/aerospace-move right'

# See: https://nikitabobko.github.io/AeroSpace/commands#resize
cmd-ctrl-up = 'resize smart -50'
cmd-ctrl-down = 'resize smart +50'
# Experiment: cycle this workspace's windows instead of resizing.
# Comment out the two resize bindings above before enabling these.
# cmd-ctrl-up = 'focus --wrap-around dfs-prev'
# cmd-ctrl-down = 'focus --wrap-around dfs-next'

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace
cmd-1 = 'workspace 1'
cmd-2 = 'workspace 2'
cmd-3 = 'workspace 3'
cmd-4 = 'workspace 4'
cmd-5 = 'workspace 5'

# See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
cmd-ctrl-1 = 'move-node-to-workspace 1'
cmd-ctrl-2 = 'move-node-to-workspace 2'
cmd-ctrl-3 = 'move-node-to-workspace 3'
cmd-ctrl-4 = 'move-node-to-workspace 4'
cmd-ctrl-5 = 'move-node-to-workspace 5'

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
alt-tab = 'workspace-back-and-forth'
# See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
cmd-ctrl-tab = 'move-workspace-to-monitor --wrap-around next'

# See: https://nikitabobko.github.io/AeroSpace/commands#mode
cmd-ctrl-semicolon = 'mode service'

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
f = [
  'layout floating tiling',
  'mode main',
] # Toggle between floating and tiling layout
backspace = ['close-all-windows-but-current', 'mode main']
# Experiment: reset window sizes instead of closing other windows.
# Comment out the active backspace binding before enabling this.
# backspace = ['balance-sizes', 'mode main']

# sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
#s = ['layout sticky tiling', 'mode main']

cmd-ctrl-h = ['join-with left', 'mode main']
cmd-ctrl-j = ['join-with down', 'mode main']
cmd-ctrl-k = ['join-with up', 'mode main']
cmd-ctrl-l = ['join-with right', 'mode main']

cmd-ctrl-n = ['''exec-and-forget ~/bin/new_safari_window''', 'mode main']
